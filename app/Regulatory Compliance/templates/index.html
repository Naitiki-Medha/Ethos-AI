<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIF2 - AI Compliance Testing UI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 30px;
        }
        
        .panel {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            border: 2px solid #e9ecef;
        }
        
        .panel h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #495057;
        }
        
        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        textarea {
            min-height: 100px;
            resize: vertical;
            font-family: inherit;
        }
        
        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .checkbox-item label {
            margin: 0;
            font-weight: 400;
            cursor: pointer;
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 10px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .test-cases {
            display: grid;
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .test-case {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #dee2e6;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .test-case:hover {
            border-color: #667eea;
            transform: translateX(5px);
        }
        
        .test-case h3 {
            color: #495057;
            font-size: 1em;
            margin-bottom: 5px;
        }
        
        .test-case p {
            color: #6c757d;
            font-size: 0.9em;
        }
        
        .test-case .expected {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 0.85em;
            font-weight: 600;
            margin-top: 8px;
        }
        
        .expected.compliant {
            background: #d4edda;
            color: #155724;
        }
        
        .expected.blocked {
            background: #f8d7da;
            color: #721c24;
        }
        
        .expected.review {
            background: #fff3cd;
            color: #856404;
        }
        
        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }
        
        .result.show {
            display: block;
        }
        
        .result.success {
            background: #d4edda;
            border: 2px solid #c3e6cb;
        }
        
        .result.error {
            background: #f8d7da;
            border: 2px solid #f5c6cb;
        }
        
        .result.warning {
            background: #fff3cd;
            border: 2px solid #ffeaa7;
        }
        
        .result h3 {
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .result.success h3 {
            color: #155724;
        }
        
        .result.error h3 {
            color: #721c24;
        }
        
        .result.warning h3 {
            color: #856404;
        }
        
        .violations {
            margin-top: 15px;
        }
        
        .violation-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #dc3545;
        }
        
        .violation-item h4 {
            color: #dc3545;
            margin-bottom: 8px;
        }
        
        .violation-item p {
            color: #495057;
            margin-bottom: 5px;
        }
        
        .violation-item .severity {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: 600;
            margin-top: 5px;
        }
        
        .severity.critical {
            background: #dc3545;
            color: white;
        }
        
        .severity.high {
            background: #fd7e14;
            color: white;
        }
        
        .severity.medium {
            background: #ffc107;
            color: #000;
        }
        
        .severity.low {
            background: #17a2b8;
            color: white;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 2px solid #dee2e6;
        }
        
        .stat-card h4 {
            color: #6c757d;
            font-size: 0.9em;
            margin-bottom: 8px;
        }
        
        .stat-card .value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛡️ PIF2 - AI Compliance Testing</h1>
            <p>Python Indian Framework for AI Compliance - Interactive Testing Interface</p>
        </div>
        
        <div class="main-content">
            <!-- Left Panel: Input Form -->
            <div class="panel">
                <h2>📝 Compliance Check</h2>
                
                <form id="complianceForm">
                    <div class="form-group">
                        <label for="userId">User ID</label>
                        <input type="text" id="userId" value="test_user_001" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="content">Content / Prompt</label>
                        <textarea id="content" placeholder="Enter content to check for compliance..." required></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="contentType">Content Type</label>
                        <select id="contentType">
                            <option value="text">Text</option>
                            <option value="image">Image</option>
                            <option value="video">Video</option>
                            <option value="audio">Audio</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Metadata Flags</label>
                        <div class="checkbox-group">
                            <div class="checkbox-item">
                                <input type="checkbox" id="userConsentSgi" checked>
                                <label for="userConsentSgi">User Consent (SGI)</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="hasSgiLabel" checked>
                                <label for="hasSgiLabel">Has SGI Label</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="explicitConsent" checked>
                                <label for="explicitConsent">Explicit Consent</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="hasAuditTrail" checked>
                                <label for="hasAuditTrail">Has Audit Trail</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="hasResponsibleParty" checked>
                                <label for="hasResponsibleParty">Responsible Party</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="safetyAssessed" checked>
                                <label for="safetyAssessed">Safety Assessed</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="hasExplanation" checked>
                                <label for="hasExplanation">Has Explanation</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="hasUserConsent">
                                <label for="hasUserConsent">PII Consent</label>
                            </div>
                        </div>
                    </div>
                    
                    <div style="margin-top: 20px;">
                        <button type="submit" class="btn btn-primary">🔍 Check Compliance</button>
                        <button type="button" class="btn btn-secondary" onclick="resetForm()">🔄 Reset</button>
                    </div>
                </form>
                
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p style="margin-top: 10px;">Checking compliance...</p>
                </div>
                
                <div class="result" id="result"></div>
            </div>
            
            <!-- Right Panel: Test Cases -->
            <div class="panel">
                <h2>🧪 Predefined Test Cases</h2>
                
                <div class="stats" id="stats">
                    <div class="stat-card">
                        <h4>Total Tests</h4>
                        <div class="value" id="totalTests">0</div>
                    </div>
                    <div class="stat-card">
                        <h4>Passed</h4>
                        <div class="value" style="color: #28a745;" id="passedTests">0</div>
                    </div>
                    <div class="stat-card">
                        <h4>Failed</h4>
                        <div class="value" style="color: #dc3545;" id="failedTests">0</div>
                    </div>
                    <div class="stat-card">
                        <h4>Accuracy</h4>
                        <div class="value" style="color: #17a2b8;" id="accuracy">0%</div>
                    </div>
                </div>
                
                <div class="test-cases" id="testCases">
                    <p style="text-align: center; color: #6c757d;">Loading test cases...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let testCases = [];
        let testResults = { total: 0, passed: 0, failed: 0 };
        
        // Load test cases on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadTestCases();
        });
        
        // Load test cases from API
        async function loadTestCases() {
            try {
                const response = await fetch('/api/test-cases');
                testCases = await response.json();
                displayTestCases();
            } catch (error) {
                console.error('Error loading test cases:', error);
            }
        }
        
        // Display test cases
        function displayTestCases() {
            const container = document.getElementById('testCases');
            container.innerHTML = '';
            
            testCases.forEach(testCase => {
                const div = document.createElement('div');
                div.className = 'test-case';
                div.onclick = () => loadTestCase(testCase);
                
                const expectedClass = testCase.expected.includes('COMPLIANT') ? 'compliant' : 
                                     testCase.expected.includes('REVIEW') ? 'review' : 'blocked';
                
                div.innerHTML = `
                    <h3>${testCase.id}. ${testCase.name}</h3>
                    <p>${testCase.content.substring(0, 60)}${testCase.content.length > 60 ? '...' : ''}</p>
                    <span class="expected ${expectedClass}">Expected: ${testCase.expected}</span>
                `;
                
                container.appendChild(div);
            });
        }
        
        // Load test case into form
        function loadTestCase(testCase) {
            document.getElementById('userId').value = 'test_user_' + testCase.id;
            document.getElementById('content').value = testCase.content;
            document.getElementById('contentType').value = testCase.content_type;
            
            // Set checkboxes
            document.getElementById('userConsentSgi').checked = testCase.metadata.user_consent_sgi || false;
            document.getElementById('hasSgiLabel').checked = testCase.metadata.has_sgi_label || false;
            document.getElementById('explicitConsent').checked = testCase.metadata.explicit_consent || false;
            document.getElementById('hasAuditTrail').checked = testCase.metadata.has_audit_trail || false;
            document.getElementById('hasResponsibleParty').checked = testCase.metadata.has_responsible_party || false;
            document.getElementById('safetyAssessed').checked = testCase.metadata.safety_assessed || false;
            document.getElementById('hasExplanation').checked = testCase.metadata.has_explanation || false;
            document.getElementById('hasUserConsent').checked = testCase.metadata.has_user_consent || false;
            
            // Scroll to form
            document.getElementById('complianceForm').scrollIntoView({ behavior: 'smooth' });
        }
        
        // Handle form submission
        document.getElementById('complianceForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Show loading
            document.getElementById('loading').classList.add('show');
            document.getElementById('result').classList.remove('show');
            
            // Gather form data
            const data = {
                user_id: document.getElementById('userId').value,
                content: document.getElementById('content').value,
                content_type: document.getElementById('contentType').value,
                metadata: {
                    user_consent_sgi: document.getElementById('userConsentSgi').checked,
                    has_sgi_label: document.getElementById('hasSgiLabel').checked,
                    explicit_consent: document.getElementById('explicitConsent').checked,
                    has_audit_trail: document.getElementById('hasAuditTrail').checked,
                    has_responsible_party: document.getElementById('hasResponsibleParty').checked,
                    safety_assessed: document.getElementById('safetyAssessed').checked,
                    has_explanation: document.getElementById('hasExplanation').checked,
                    has_user_consent: document.getElementById('hasUserConsent').checked,
                    bias_detected: false,
                    contains_personal_data: false
                }
            };
            
            try {
                const response = await fetch('/api/check', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                displayResult(result);
                updateStats(result);
                
            } catch (error) {
                displayError(error.message);
            } finally {
                document.getElementById('loading').classList.remove('show');
            }
        });
        
        // Display result
        function displayResult(result) {
            const resultDiv = document.getElementById('result');
            resultDiv.classList.add('show');
            
            if (result.error) {
                resultDiv.className = 'result show error';
                resultDiv.innerHTML = `
                    <h3>❌ Error</h3>
                    <p>${result.message}</p>
                    <p style="color: #721c24; margin-top: 10px;">${result.error}</p>
                `;
                return;
            }
            
            if (result.is_compliant) {
                resultDiv.className = 'result show success';
                resultDiv.innerHTML = `
                    <h3>✅ Compliant</h3>
                    <p><strong>Message:</strong> ${result.message}</p>
                    <p><strong>Severity:</strong> <span class="severity ${result.severity.toLowerCase()}">${result.severity}</span></p>
                    <p><strong>Timestamp:</strong> ${new Date(result.timestamp).toLocaleString()}</p>
                `;
            } else if (result.requires_human_review) {
                resultDiv.className = 'result show warning';
                resultDiv.innerHTML = `
                    <h3>⚠️ Human Review Required</h3>
                    <p><strong>Message:</strong> ${result.message}</p>
                    <p><strong>Review Case ID:</strong> ${result.review_case_id}</p>
                    <p><strong>Severity:</strong> <span class="severity ${result.severity.toLowerCase()}">${result.severity}</span></p>
                    ${displayViolations(result.violations)}
                `;
            } else {
                resultDiv.className = 'result show error';
                resultDiv.innerHTML = `
                    <h3>❌ Blocked</h3>
                    <p><strong>Message:</strong> ${result.message}</p>
                    <p><strong>Severity:</strong> <span class="severity ${result.severity.toLowerCase()}">${result.severity}</span></p>
                    ${displayViolations(result.violations)}
                `;
            }
            
            resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        
        // Display violations
        function displayViolations(violations) {
            if (!violations || violations.length === 0) {
                return '';
            }
            
            let html = '<div class="violations"><h4>Violations:</h4>';
            
            violations.forEach(v => {
                html += `
                    <div class="violation-item">
                        <h4>${v.rule}</h4>
                        <p>${v.message}</p>
                        ${v.legal_reference ? `<p><strong>Legal Reference:</strong> ${v.legal_reference}</p>` : ''}
                        <span class="severity ${v.severity.toLowerCase()}">${v.severity}</span>
                    </div>
                `;
            });
            
            html += '</div>';
            return html;
        }
        
        // Display error
        function displayError(message) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'result show error';
            resultDiv.classList.add('show');
            resultDiv.innerHTML = `
                <h3>❌ Error</h3>
                <p>${message}</p>
            `;
        }
        
        // Update statistics
        function updateStats(result) {
            testResults.total++;
            
            if (result.is_compliant) {
                testResults.passed++;
            } else {
                testResults.failed++;
            }
            
            document.getElementById('totalTests').textContent = testResults.total;
            document.getElementById('passedTests').textContent = testResults.passed;
            document.getElementById('failedTests').textContent = testResults.failed;
            
            const accuracy = testResults.total > 0 ? 
                Math.round((testResults.passed / testResults.total) * 100) : 0;
            document.getElementById('accuracy').textContent = accuracy + '%';
        }
        
        // Reset form
        function resetForm() {
            document.getElementById('complianceForm').reset();
            document.getElementById('result').classList.remove('show');
            
            // Reset to default checked states
            document.getElementById('userConsentSgi').checked = true;
            document.getElementById('hasSgiLabel').checked = true;
            document.getElementById('explicitConsent').checked = true;
            document.getElementById('hasAuditTrail').checked = true;
            document.getElementById('hasResponsibleParty').checked = true;
            document.getElementById('safetyAssessed').checked = true;
            document.getElementById('hasExplanation').checked = true;
        }
    </script>
</body>
</html>
