<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIF2 - AI Compliance Testing</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .header p { font-size: 1.1em; opacity: 0.9; }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 30px;
        }
        
        .panel {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            border: 2px solid #e9ecef;
        }
        
        .panel h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .form-group { margin-bottom: 15px; }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #495057;
        }
        
        input[type="text"], textarea, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #dee2e6;
            border-radius: 5px;
            font-size: 14px;
        }
        
        textarea { min-height: 80px; resize: vertical; font-family: inherit; }
        
        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 8px;
        }
        
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .checkbox-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
        }
        
        .checkbox-item label {
            margin: 0;
            font-weight: 400;
            font-size: 13px;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-right: 10px;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .test-cases {
            display: grid;
            gap: 10px;
            max-height: 500px;
            overflow-y: auto;
        }
        
        .test-case {
            background: white;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #dee2e6;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .test-case:hover {
            border-color: #667eea;
            transform: translateX(3px);
        }
        
        .test-case h3 {
            color: #495057;
            font-size: 0.95em;
            margin-bottom: 5px;
        }
        
        .test-case p {
            color: #6c757d;
            font-size: 0.85em;
            margin-bottom: 5px;
        }
        
        .expected {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: 600;
        }
        
        .expected.compliant { background: #d4edda; color: #155724; }
        .expected.blocked { background: #f8d7da; color: #721c24; }
        .expected.review { background: #fff3cd; color: #856404; }
        
        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }
        
        .result.show { display: block; }
        .result.success { background: #d4edda; border: 2px solid #c3e6cb; }
        .result.error { background: #f8d7da; border: 2px solid #f5c6cb; }
        .result.warning { background: #fff3cd; border: 2px solid #ffeaa7; }
        
        .result h3 { margin-bottom: 10px; font-size: 1.2em; }
        .result.success h3 { color: #155724; }
        .result.error h3 { color: #721c24; }
        .result.warning h3 { color: #856404; }
        
        .violation-item {
            background: white;
            padding: 12px;
            border-radius: 6px;
            margin: 8px 0;
            border-left: 4px solid #dc3545;
        }
        
        .violation-item h4 { color: #dc3545; margin-bottom: 5px; font-size: 0.95em; }
        .violation-item p { color: #495057; font-size: 0.9em; margin: 3px 0; }
        
        .severity {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.8em;
            font-weight: 600;
            margin-top: 5px;
        }
        
        .severity.critical { background: #dc3545; color: white; }
        .severity.high { background: #fd7e14; color: white; }
        .severity.medium { background: #ffc107; color: #000; }
        .severity.low { background: #17a2b8; color: white; }
        
        .loading {
            display: none;
            text-align: center;
            padding: 15px;
        }
        
        .loading.show { display: block; }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .stat-card {
            background: white;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            border: 2px solid #dee2e6;
        }
        
        .stat-card h4 { color: #6c757d; font-size: 0.85em; margin-bottom: 5px; }
        .stat-card .value { font-size: 1.8em; font-weight: bold; color: #667eea; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛡️ PIF2 - AI Compliance Testing</h1>
            <p>Python Indian Framework for AI Compliance</p>
        </div>
        
        <div class="main-content">
            <div class="panel">
                <h2>📝 Compliance Check</h2>
                
                <div class="form-group">
                    <label>User ID</label>
                    <input type="text" id="userId" value="test_user_001">
                </div>
                
                <div class="form-group">
                    <label>Content / Prompt</label>
                    <textarea id="content" placeholder="Enter content..."></textarea>
                </div>
                
                <div class="form-group">
                    <label>Content Type</label>
                    <select id="contentType">
                        <option value="text">Text</option>
                        <option value="image">Image</option>
                        <option value="video">Video</option>
                        <option value="audio">Audio</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Metadata Flags</label>
                    <div class="checkbox-group">
                        <div class="checkbox-item">
                            <input type="checkbox" id="userConsentSgi" checked>
                            <label for="userConsentSgi">User Consent (SGI)</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="hasSgiLabel" checked>
                            <label for="hasSgiLabel">Has SGI Label</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="explicitConsent" checked>
                            <label for="explicitConsent">Explicit Consent</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="hasAuditTrail" checked>
                            <label for="hasAuditTrail">Audit Trail</label>
                        </div>
                    </div>
                </div>
                
                <div style="margin-top: 15px;">
                    <button class="btn btn-primary" onclick="checkCompliance()">🔍 Check</button>
                    <button class="btn btn-secondary" onclick="resetForm()">🔄 Reset</button>
                </div>
                
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Checking...</p>
                </div>
                
                <div class="result" id="result"></div>
            </div>
            
            <div class="panel">
                <h2>🧪 Test Cases</h2>
                
                <div class="stats">
                    <div class="stat-card">
                        <h4>Total</h4>
                        <div class="value" id="totalTests">0</div>
                    </div>
                    <div class="stat-card">
                        <h4>Passed</h4>
                        <div class="value" style="color: #28a745;" id="passedTests">0</div>
                    </div>
                    <div class="stat-card">
                        <h4>Failed</h4>
                        <div class="value" style="color: #dc3545;" id="failedTests">0</div>
                    </div>
                    <div class="stat-card">
                        <h4>Accuracy</h4>
                        <div class="value" style="color: #17a2b8;" id="accuracy">0%</div>
                    </div>
                </div>
                
                <div class="test-cases" id="testCases">
                    <p style="text-align: center; color: #6c757d;">Loading...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let testCases = [];
        let stats = { total: 0, passed: 0, failed: 0 };
        
        // Load test cases
        fetch('/api/test-cases')
            .then(r => r.json())
            .then(data => {
                testCases = data;
                displayTestCases();
            })
            .catch(e => console.error('Error:', e));
        
        function displayTestCases() {
            const container = document.getElementById('testCases');
            container.innerHTML = '';
            
            testCases.forEach(tc => {
                const div = document.createElement('div');
                div.className = 'test-case';
                div.onclick = () => loadTestCase(tc);
                
                const expClass = tc.expected.includes('COMPLIANT') ? 'compliant' : 
                                tc.expected.includes('REVIEW') ? 'review' : 'blocked';
                
                div.innerHTML = `
                    <h3>${tc.id}. ${tc.name}</h3>
                    <p>${tc.content.substring(0, 50)}...</p>
                    <span class="expected ${expClass}">${tc.expected}</span>
                `;
                
                container.appendChild(div);
            });
        }
        
        function loadTestCase(tc) {
            document.getElementById('userId').value = 'test_user_' + tc.id;
            document.getElementById('content').value = tc.content;
            document.getElementById('contentType').value = tc.content_type;
            
            document.getElementById('userConsentSgi').checked = tc.metadata.user_consent_sgi || false;
            document.getElementById('hasSgiLabel').checked = tc.metadata.has_sgi_label || false;
            document.getElementById('explicitConsent').checked = tc.metadata.explicit_consent || false;
            document.getElementById('hasAuditTrail').checked = tc.metadata.has_audit_trail || false;
        }
        
        function checkCompliance() {
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            
            loading.classList.add('show');
            result.classList.remove('show');
            
            const data = {
                user_id: document.getElementById('userId').value,
                content: document.getElementById('content').value,
                content_type: document.getElementById('contentType').value,
                metadata: {
                    user_consent_sgi: document.getElementById('userConsentSgi').checked,
                    has_sgi_label: document.getElementById('hasSgiLabel').checked,
                    explicit_consent: document.getElementById('explicitConsent').checked,
                    has_audit_trail: document.getElementById('hasAuditTrail').checked
                }
            };
            
            fetch('/api/check', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(r => r.json())
            .then(data => {
                loading.classList.remove('show');
                displayResult(data);
                updateStats(data);
            })
            .catch(e => {
                loading.classList.remove('show');
                result.className = 'result show error';
                result.innerHTML = '<h3>❌ Error</h3><p>' + e.message + '</p>';
                result.classList.add('show');
            });
        }
        
        function displayResult(data) {
            const result = document.getElementById('result');
            result.classList.add('show');
            
            if (data.is_compliant) {
                result.className = 'result show success';
                result.innerHTML = `
                    <h3>✅ Compliant</h3>
                    <p><strong>Message:</strong> ${data.message}</p>
                    <p><strong>Severity:</strong> <span class="severity ${data.severity.toLowerCase()}">${data.severity}</span></p>
                `;
            } else if (data.requires_human_review) {
                result.className = 'result show warning';
                result.innerHTML = `
                    <h3>⚠️ Human Review Required</h3>
                    <p><strong>Message:</strong> ${data.message}</p>
                    <p><strong>Case ID:</strong> ${data.review_case_id}</p>
                    <p><strong>Severity:</strong> <span class="severity ${data.severity.toLowerCase()}">${data.severity}</span></p>
                    ${displayViolations(data.violations)}
                `;
            } else {
                result.className = 'result show error';
                result.innerHTML = `
                    <h3>❌ Blocked</h3>
                    <p><strong>Message:</strong> ${data.message}</p>
                    <p><strong>Severity:</strong> <span class="severity ${data.severity.toLowerCase()}">${data.severity}</span></p>
                    ${displayViolations(data.violations)}
                `;
            }
        }
        
        function displayViolations(violations) {
            if (!violations || violations.length === 0) return '';
            
            let html = '<div style="margin-top:10px"><h4>Violations:</h4>';
            violations.forEach(v => {
                html += `
                    <div class="violation-item">
                        <h4>${v.rule}</h4>
                        <p>${v.message}</p>
                        <p><strong>Legal:</strong> ${v.legal_reference}</p>
                        <span class="severity ${v.severity.toLowerCase()}">${v.severity}</span>
                    </div>
                `;
            });
            html += '</div>';
            return html;
        }
        
        function updateStats(data) {
            stats.total++;
            if (data.is_compliant) stats.passed++;
            else stats.failed++;
            
            document.getElementById('totalTests').textContent = stats.total;
            document.getElementById('passedTests').textContent = stats.passed;
            document.getElementById('failedTests').textContent = stats.failed;
            
            const acc = stats.total > 0 ? Math.round((stats.passed / stats.total) * 100) : 0;
            document.getElementById('accuracy').textContent = acc + '%';
        }
        
        function resetForm() {
            document.getElementById('userId').value = 'test_user_001';
            document.getElementById('content').value = '';
            document.getElementById('contentType').value = 'text';
            document.getElementById('userConsentSgi').checked = true;
            document.getElementById('hasSgiLabel').checked = true;
            document.getElementById('explicitConsent').checked = true;
            document.getElementById('hasAuditTrail').checked = true;
            document.getElementById('result').classList.remove('show');
        }
    </script>
</body>
</html>
